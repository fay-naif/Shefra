<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الشيفرة الأخيرة | THE LAST CODE</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="bg"></canvas>                 
  <div class="monitors" aria-hidden="true">  
    <div class="mon mon-l"><pre></pre></div>
    <div class="mon mon-c"><pre></pre></div>
    <div class="mon mon-r"><pre></pre></div>
  </div>
  <div class="scene-num" aria-hidden="true"></div> 
  <div class="fx-vignette"></div>
  <div class="fx-scan"></div>
  <div class="fx-grain"></div>
  <div class="fx-flash"></div>               


  <header id="hud" class="hud hidden">
    <div class="hud-brand">الشيفرة الأخيرة</div>
    <div class="hud-timer" id="timer">45:00</div>
    <div class="hud-side">
      <div class="locks" id="locks"></div>
      <button class="icon-btn" id="hintBtn" title="تلميح (−2 دقيقة)">تلميح <small>−2د</small></button>
      <button class="icon-btn" id="muteBtn" title="الصوت">🔊</button>
    </div>
  </header>

  <main id="stage" class="stage"></main>


  <div id="toast" class="toast"></div>

  <script src="js/vendor/gsap.min.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
